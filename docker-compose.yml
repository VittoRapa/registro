services:
  postgres:
    image: postgres:16-alpine
    container_name: registro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: registro
      POSTGRES_PASSWORD: registro
      POSTGRES_DB: registro
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U registro -d registro']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: registro-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: registro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  create-buckets:
    image: minio/mc:latest
    container_name: registro-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/registro-files;
      /usr/bin/mc anonymous set download myminio/registro-files/public;
      exit 0;
      "

  clamav:
    image: clamav/clamav:latest
    container_name: registro-clamav
    restart: unless-stopped
    ports:
      - '3310:3310'

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: registro-gotenberg
    restart: unless-stopped
    ports:
      - '3001:3000'

  mailpit:
    image: axllent/mailpit:latest
    container_name: registro-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
