version: '3.8'

services:
  # 1. Reverse Proxy with Automated TLS
  caddy:
    image: caddy:2-alpine
    container_name: registro-caddy-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - public_net

  # 2. Frontend Web (Next.js 15)
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: registro-web-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://registro.local/api/v1
    depends_on:
      - api
    networks:
      - public_net

  # 3. Backend API (NestJS 10)
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: registro-api-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-registro}:${POSTGRES_PASSWORD:-registro_secret_pw}@postgres:5432/${POSTGRES_DB:-registro}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-prod_jwt_access_secret_32_characters_minimum}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_32_characters_minimum}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=30d
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minio_secret_prod_key}
      - S3_BUCKET=registro-files
      - S3_REGION=eu-central-1
      - GOTENBERG_URL=http://gotenberg:3000
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - SMTP_HOST=${SMTP_HOST:-smtp.eu.mailgun.org}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM="Registro Elettronico <noreply@registro-scuola.it>"
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - public_net
      - internal_net

  # 4. Database PostgreSQL 16 (Isolato su rete interna)
  postgres:
    image: postgres:16-alpine
    container_name: registro-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registro_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-registro}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-registro} -d ${POSTGRES_DB:-registro}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 5. Redis Caching & BullMQ
  redis:
    image: redis:7-alpine
    container_name: registro-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 6. MinIO S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: registro-minio-prod
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secret_prod_key}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # 7. Gotenberg (Generazione PDF & Pagelle)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: registro-gotenberg-prod
    restart: always
    networks:
      - internal_net

  # 8. ClamAV (Scansione Antivirus allegati)
  clamav:
    image: clamav/clamav:latest
    container_name: registro-clamav-prod
    restart: always
    networks:
      - internal_net

networks:
  public_net:
    driver: bridge
  internal_net:
    internal: true
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  caddy_data:
  caddy_config:
