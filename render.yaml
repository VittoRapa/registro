# ==============================================================================
# Render Blueprint for Registro Elettronico (Backend API + Cloud PostgreSQL)
# Region: Frankfurt, Germany (EU - GDPR compliant)
# ==============================================================================

databases:
  - name: registro-postgres
    plan: free
    region: frankfurt
    databaseName: registro
    user: registro

services:
  - type: web
    name: registro-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --prod=false && pnpm --filter @registro/api prisma:generate && pnpm --filter @registro/api build
    preDeployCommand: pnpm --filter @registro/api prisma:push --skip-generate
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: registro-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: S3_ENDPOINT
        value: http://localhost:9000
      - key: S3_ACCESS_KEY
        value: minioadmin
      - key: S3_SECRET_KEY
        value: minioadmin
      - key: S3_BUCKET
        value: registro-files
      - key: S3_REGION
        value: eu-central-1
      - key: GOTENBERG_URL
        value: http://localhost:3001
      - key: CLAMAV_HOST
        value: localhost
      - key: CLAMAV_PORT
        value: 3310
